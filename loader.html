<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peer Review | Booting</title>
<link rel="icon" href="images/peer-review-mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#04060d;color:#d9f9ff;font-family:'Rajdhani',Arial,sans-serif;overflow:hidden}
  body{display:grid;place-items:center;
    background:radial-gradient(60% 50% at 50% 40%,rgba(0,229,255,.14),transparent 70%),radial-gradient(40% 40% at 80% 90%,rgba(168,85,255,.16),transparent 70%),#04060d}
  body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 75%)}
  body::after{content:"";position:fixed;left:0;right:0;height:140px;top:-140px;background:linear-gradient(transparent,rgba(0,229,255,.12),transparent);animation:scan 2.6s linear infinite}
  @keyframes scan{to{transform:translateY(calc(100vh + 140px))}}
  .boot{position:relative;text-align:center;width:min(440px,86vw)}
  .boot img{width:100%;filter:drop-shadow(0 0 18px rgba(0,229,255,.55));animation:pop .9s cubic-bezier(.2,.8,.2,1.2)}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .bar{margin:34px auto 14px;height:4px;border-radius:4px;background:rgba(0,229,255,.15);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#a855ff);box-shadow:0 0 14px #00e5ff;animation:fill 2.4s ease-out forwards}
  @keyframes fill{to{width:100%}}
  .log{font-family:'Orbitron',sans-serif;font-size:.68rem;letter-spacing:.28em;color:#7fd8e6;text-transform:uppercase;min-height:1.2em}
</style>
</head>
<body>
<div class="boot">
  <img src="images/peer-review-logo.svg" alt="Peer Review">
  <div class="bar"><i></i></div>
  <div class="log" id="log">Initialising core</div>
</div>
<script>
  const steps=['Initialising core','Syncing modules','Calibrating interface','Ready'];
  let i=0;const el=document.getElementById('log');
  setInterval(()=>{i=Math.min(i+1,steps.length-1);el.textContent=steps[i];},650);
</script>
</body>
</html>
